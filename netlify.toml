# Next.js on Netlify: Netlify detects Next.js and applies its OpenNext adapter automatically (do not pin
# @netlify/plugin-nextjs). Server pages and app/api/* route handlers run as Netlify Functions.
[build]
  # webpack build: Turbopack server externals use symlinks, which Windows blocks during local Netlify builds.
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Server secrets (MONGODB_URI, JWT_SECRET) are NOT stored here. They are imported into the site's environment
# variables with `netlify env:import .env.local` and `netlify env:import .env` (run by the site owner).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
