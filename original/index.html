<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وسمي Wasmi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette: warm espresso and sand neutrals with one amber primary. Layout concept: a hash-routed shop. Dark rain-ripple hero opens the home page, then calm editorial pages; every scent is a named Gulf weather moment with its own season on a 12-month calendar. RTL, Gulf dialect copy. */
:root{
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --bg:#FBF4EA; --surface:#FFFBF5; --fg:#2A1A10; --muted:#7A6452; --line:#EBD9C4;
  --accent:#A9560C; --saffron:#E58A2B; --on-saffron:#2A1406; --danger:#B03A24;
  --hero-bg:#1E120B; --hero-fg:#F7EBDA; --hero-muted:#CDB59B; --hero-line:rgba(247,235,218,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A110C; --surface:#251810; --fg:#F6E9D8; --muted:#BDA58F; --line:#3B2A1F; --accent:#F0A04B; --danger:#F29A86; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A110C; --surface:#251810; --fg:#F6E9D8; --muted:#BDA58F; --line:#3B2A1F; --accent:#F0A04B; --danger:#F29A86; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.7;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(44px,7vw,84px)}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:600}
.muted{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--saffron);margin-inline-end:8px;box-shadow:0 0 0 4px color-mix(in srgb,var(--saffron) 25%,transparent)}
svg.i{width:20px;height:20px;flex:none}

/* announcement + nav */
.announce{background:var(--hero-bg);color:var(--hero-muted);font-size:.82rem;text-align:center;padding:7px 0;border-bottom:1px solid var(--hero-line)}
.announce b{color:var(--saffron);font-weight:600}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1}
.logo small{display:block;font-size:.62rem;letter-spacing:.32em;color:var(--muted);margin-top:3px;direction:ltr;text-align:start}
.links{display:flex;gap:22px;font-size:.93rem}
.links a{text-decoration:none;color:var(--muted);padding-block:4px;border-bottom:2px solid transparent}
.links a:hover{color:var(--fg)}
.links a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--saffron)}
.actions{display:flex;gap:8px;margin-inline-start:auto}
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.ib:hover{border-color:var(--fg)}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--saffron);color:var(--on-saffron);font-size:11px;font-weight:600;line-height:18px;text-align:center}
.badge[hidden]{display:none}
.bump{animation:pop .35s}
.menu-btn{display:none}
.mnav{position:absolute;top:100%;inset-inline:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) 16px;display:flex;flex-direction:column}
.mnav[hidden]{display:none}
.mnav a{padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:1.05rem}

#view>*{animation:fadein .45s both}
@keyframes fadein{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 26px;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .2s,background .2s,opacity .2s;background:var(--fg);color:var(--bg)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:var(--saffron);color:var(--on-saffron)}
.btn.ghost{background:transparent;color:var(--hero-fg);border:1px solid var(--hero-line)}
.btn.ghost:hover{border-color:var(--hero-fg)}
.btn.line{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.line:hover{border-color:var(--fg)}
.btn.sm{padding:9px 18px;font-size:.9rem}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.arrow{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;color:var(--accent)}
.arrow:hover{gap:10px}

/* hero */
.hero{position:relative;background:var(--hero-bg);color:var(--hero-fg);overflow:hidden;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .wrap{padding-block:clamp(40px,7vw,88px) clamp(36px,5vw,64px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px;align-items:center}
.eyebrow{margin:0;color:var(--saffron);font-size:.95rem;letter-spacing:.03em}
.hero h1{font-weight:700;font-size:clamp(5.5rem,20vw,11.5rem);line-height:.9;margin-top:.1em;color:var(--saffron);background:linear-gradient(180deg,#FFCB8A 0%,#E58A2B 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.latin{direction:ltr;text-align:start;font-size:.8rem;letter-spacing:.7em;color:var(--hero-muted);margin-top:6px}
.lead{font-family:var(--font-display);font-weight:500;font-size:clamp(1.6rem,4vw,2.4rem);margin:clamp(18px,3vw,30px) 0 10px;line-height:1.25}
.sub{max-width:46ch;color:var(--hero-muted);margin:0 0 26px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.nowline{margin:22px 0 0;font-size:.9rem;color:var(--hero-muted)}
.nowline b{color:var(--hero-fg);font-weight:500}
.facts{list-style:none;margin:clamp(26px,4vw,44px) 0 0;padding:16px 0 0;border-top:1px solid var(--hero-line);display:flex;flex-wrap:wrap;gap:8px 0;font-size:.88rem;color:var(--hero-muted)}
.facts li+li{margin-inline-start:20px;padding-inline-start:20px;border-inline-start:1px solid var(--hero-line)}
.hero-art{position:relative;display:grid;place-items:center;min-width:0}
.hero-art::before{content:"";position:absolute;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(229,138,43,.3),transparent 68%)}
.hero-art svg{position:relative;width:min(330px,78%);height:auto;animation:floaty 6s ease-in-out infinite;filter:drop-shadow(0 24px 30px rgba(0,0,0,.45))}
.hero-tag{position:absolute;bottom:6%;inset-inline-start:2%;background:rgba(30,18,11,.8);border:1px solid var(--hero-line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 14px;border-radius:999px;font-size:.85rem;text-decoration:none;color:var(--hero-fg)}
.hero-tag b{color:var(--saffron);font-weight:600;margin-inline-start:6px}
.marq{background:var(--hero-bg);border-top:1px solid var(--hero-line);border-bottom:1px solid var(--hero-line);overflow:hidden;direction:ltr}
.marq .track{display:flex;width:max-content;animation:marq 60s linear infinite}
.marq span{direction:rtl;white-space:nowrap;padding:12px 28px;color:var(--hero-muted);font-family:var(--font-display);font-size:1.05rem}
.marq span::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--saffron);margin-inline-start:28px;vertical-align:middle}

/* shared page bits */
.page-head{padding-top:clamp(32px,5vw,56px);padding-bottom:12px;display:flex;flex-direction:column;gap:8px}
.page-head p{margin:0;color:var(--muted);max-width:56ch}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--fg)}
.row-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}
.row-head p{margin:6px 0 0;color:var(--muted)}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 20px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.empty{grid-column:1/-1;padding:56px 0;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.art-wrap{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/5;max-width:100%;background:linear-gradient(165deg,color-mix(in srgb,var(--c1) 40%,var(--surface)),color-mix(in srgb,var(--c2) 24%,var(--surface)))}
.art{all:unset;position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.art:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:10px}
.art svg{width:80%;height:auto;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.art-wrap:hover .art svg,.art-wrap.show .art svg{transform:translateY(-6px) scale(1.04)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite alternate}
.smoke{stroke-dasharray:7 9;animation:rise 3s linear infinite}
.notes{position:absolute;inset-inline:0;bottom:0;padding:14px 14px 16px;display:grid;gap:7px;font-size:.82rem;line-height:1.5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transform:translateY(101%);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.notes b{color:var(--accent);font-weight:600;margin-inline-end:8px}
.art-wrap.show .notes,.art:focus-visible~.notes{transform:none}
@media (hover:hover){.art-wrap:hover .notes{transform:none}}
.tag{position:absolute;top:10px;inset-inline-start:10px;font-size:.72rem;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tag.now{top:38px;display:flex;align-items:center;color:var(--fg)}
.tag.now .dot{width:6px;height:6px;margin-inline-end:6px;box-shadow:none}
.fav{position:absolute;top:6px;inset-inline-end:6px;width:42px;height:42px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.fav svg{width:22px;height:22px;fill:color-mix(in srgb,var(--bg) 40%,transparent);transition:fill .2s,stroke .2s}
.fav[aria-pressed="true"] svg{fill:var(--saffron);stroke:var(--saffron);animation:pop .4s}
.info{display:flex;flex-direction:column;gap:6px}
.nm{display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.nm h3{font-size:1.28rem;font-weight:600}
.nm h3 a{text-decoration:none}
.en{font-size:.72rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.mo{margin:0;font-size:.88rem;color:var(--muted);line-height:1.5}
.pr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:2px;font-size:.88rem}
.pr b{font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}
.pr span{color:var(--muted);font-size:.8rem}
.buy{margin-top:4px;border:0;border-radius:8px;padding:10px 12px;background:var(--fg);color:var(--bg);font-weight:600;cursor:pointer;transition:background .2s,color .2s,transform .15s}
.buy:hover{transform:translateY(-1px)}
.buy.ok{background:var(--saffron);color:var(--on-saffron)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:10px}
.search{position:relative;flex:1 1 260px;max-width:380px;min-width:0}
.search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field,.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font-size:.95rem}
.search input{padding-inline-start:42px}
.field::placeholder,.search input::placeholder{color:var(--muted)}
.chips{flex:1 1 320px;min-width:0;display:flex;gap:8px;overflow-x:auto;padding-block:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:999px;font-size:.9rem;cursor:pointer;transition:background .2s,color .2s}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{opacity:.65;margin-inline-start:6px;font-size:.78rem}
.tb2{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;margin:6px 0 4px;font-size:.9rem}
.tb2 label{display:flex;align-items:center;gap:10px}
.tb2 select{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.tb2 input[type=range]{accent-color:var(--saffron);width:150px}
.tb2 output{font-variant-numeric:tabular-nums;min-width:5.5em}
.count{font-size:.85rem;color:var(--muted);margin:10px 0 18px;min-height:1.4em}

/* calendar */
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.calg{display:grid;grid-template-columns:118px repeat(12,minmax(40px,1fr));min-width:640px}
.calg>div{border-top:1px solid var(--line);min-height:28px;display:flex;align-items:center}
.calg .h{border-top:0;font-size:.7rem;color:var(--muted);justify-content:center;padding-block:8px}
.calg .nmc{padding-inline:12px;font-size:.85rem;font-weight:500}
.calg .nmc a{text-decoration:none}
.calg .nmc a:hover{color:var(--accent)}
.calg .c i{display:block;width:100%;height:10px;background:var(--c1);margin-inline:0;opacity:.92}
.calg .c.s i{border-start-start-radius:5px;border-end-start-radius:5px;margin-inline-start:4px;width:calc(100% - 4px)}
.calg .c.e i{border-start-end-radius:5px;border-end-end-radius:5px;margin-inline-end:4px;width:calc(100% - 4px)}
.calg .c.s.e i{width:calc(100% - 8px)}
.calg .now{background:color-mix(in srgb,var(--saffron) 14%,transparent)}
.calg .h.now{color:var(--accent);font-weight:600}

/* bands */
.band{background:var(--hero-bg);color:var(--hero-fg)}
.band .wrap{padding-block:clamp(44px,7vw,80px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px}
.band h2{font-size:clamp(2rem,5vw,3.4rem);max-width:16ch}
.band p{color:var(--hero-muted);margin:10px 0 0;max-width:44ch}
.band .art-mini{width:140px;flex:none}
.why{background:var(--surface);border-block:1px solid var(--line)}
.why .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,72px)}
.why h2{font-size:clamp(2rem,4.6vw,3.2rem)}
.why-list div{padding-block:20px;border-top:1px solid var(--line)}
.why-list div:first-child{padding-top:0;border-top:0}
.why-list h3{font-size:1.25rem;font-weight:600;margin-bottom:4px}
.why-list p{margin:0;color:var(--muted)}
.adsec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,64px);align-items:start}
.beats{list-style:none;margin:20px 0 0;padding:0}
.beats li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding-block:14px;border-top:1px solid var(--line)}
.beats .sec-t{font-size:.8rem;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:4px}
.beats h3{font-size:1.1rem;font-weight:600}
.beats p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.vframe{width:min(280px,100%);aspect-ratio:9/16;border-radius:14px;background:var(--hero-bg);color:var(--hero-fg);position:relative;overflow:hidden;display:grid;place-items:center}
.vframe video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.vframe video[hidden]{display:none}
.vph{text-align:center;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:.9rem;color:var(--hero-muted)}
.vph svg{width:44px;height:44px;color:var(--saffron)}
.vph[hidden]{display:none}
.upl{margin-top:12px;display:inline-flex}
.upl input{position:absolute;width:1px;height:1px;opacity:0}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);padding-bottom:clamp(32px,5vw,56px)}
.stage{position:sticky;top:90px;align-self:start;aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:repeating-radial-gradient(circle at 50% 80%,transparent 0 30px,rgba(255,255,255,.07) 31px 32px),linear-gradient(165deg,color-mix(in srgb,var(--c1) 55%,var(--surface)),color-mix(in srgb,var(--c2) 40%,var(--surface)));perspective:900px}
.stage svg{width:64%;height:auto;transition:transform .15s;transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));filter:drop-shadow(0 26px 24px rgba(0,0,0,.35))}
.pinfo{display:flex;flex-direction:column;gap:18px;min-width:0}
.pinfo h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:700}
.pinfo .moment{font-family:var(--font-display);font-size:1.25rem;color:var(--accent);margin:0}
.pinfo .desc{margin:0;max-width:52ch;color:var(--muted)}
.price-big{font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:.8rem;color:var(--muted);margin-bottom:8px;display:block}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:transparent;padding:8px 16px;border-radius:8px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.buyrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px}
.qty button{width:36px;height:40px;border:0;background:transparent;font-size:1.1rem;cursor:pointer;border-radius:8px}
.qty button:hover{background:var(--surface)}
.qty span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.pyr{display:flex;flex-direction:column;gap:6px}
.pyr div{width:var(--w);margin-inline:auto;padding:9px 14px;border-radius:6px;text-align:center;background:color-mix(in srgb,var(--c1) 28%,var(--surface));border:1px solid color-mix(in srgb,var(--c1) 35%,var(--line));font-size:.9rem;line-height:1.5}
.pyr b{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--accent);font-weight:600}
.seasonbar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;font-size:.62rem;text-align:center;color:var(--muted)}
.seasonbar i{display:block;height:8px;border-radius:2px;background:var(--line);margin-bottom:4px}
.seasonbar .on i{background:var(--c1)}
.seasonbar .nowm{color:var(--accent);font-weight:600}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--saffron)}
.tabp{padding-top:14px;color:var(--muted);max-width:52ch}
.tabp[hidden]{display:none}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:.8rem;color:var(--muted)}
.trust div{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--line);border-radius:8px}
.trust svg{color:var(--accent)}

/* finder */
.fwrap{max-width:780px;margin-inline:auto;padding-block:clamp(24px,4vw,48px) clamp(48px,7vw,88px)}
.dots{display:flex;gap:8px;margin-bottom:26px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--saffron)}
.fq h2{margin-bottom:6px}
.fopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.fo{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:18px;cursor:pointer;transition:border-color .2s,transform .2s;display:flex;flex-direction:column;gap:2px}
.fo:hover{border-color:var(--fg);transform:translateY(-2px)}
.fo b{font-family:var(--font-display);font-size:1.25rem;font-weight:600}
.fo span{color:var(--muted);font-size:.88rem}
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;margin-block:22px}
.res .art-wrap{max-width:320px}
.pct{font-family:var(--font-display);font-size:3rem;font-weight:700;color:var(--accent);line-height:1}
.back{margin-top:18px}

/* gift */
.gift{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,48px);padding-bottom:clamp(40px,6vw,72px)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{aspect-ratio:4/5;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;position:relative;color:var(--muted);font-size:.85rem;text-align:center;overflow:hidden}
.slot.f{border-style:solid;border-color:transparent;background:linear-gradient(165deg,color-mix(in srgb,var(--c1) 40%,var(--surface)),color-mix(in srgb,var(--c2) 24%,var(--surface)))}
.slot svg.art-s{width:78%;height:auto}
.slot button{position:absolute;top:4px;inset-inline-end:4px;width:30px;height:30px;border:0;border-radius:50%;background:color-mix(in srgb,var(--bg) 85%,transparent);cursor:pointer;display:grid;place-items:center}
.slot button svg{width:16px;height:16px}
.slot small{position:absolute;bottom:6px;inset-inline:0;font-size:.74rem;color:var(--fg);font-weight:500}
.gbox{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--surface);display:flex;flex-direction:column;gap:16px;position:sticky;top:90px;align-self:start}
.ln{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:.95rem}
.ln.tot{font-weight:600;font-size:1.1rem;padding-top:10px;border-top:1px solid var(--line)}
.ln .sv{color:var(--accent)}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pk{border:1.5px solid var(--line);border-radius:10px;padding:8px;background:transparent;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.pk:hover{border-color:var(--fg)}
.pk[aria-pressed="true"]{border-color:var(--saffron);background:color-mix(in srgb,var(--saffron) 12%,transparent)}
.pk svg{width:70%;height:auto}
.pk b{font-size:.86rem;font-family:var(--font-display);font-weight:600}
.pk small{color:var(--muted);font-size:.75rem}

/* forms */
.form{display:grid;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:.88rem;font-weight:500}
.fld .field.bad{border-color:var(--danger)}
.err{color:var(--danger);font-size:.82rem;min-height:1.2em}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:var(--surface)}
.radio input{margin-top:5px;accent-color:var(--saffron)}
.radio span{display:block;font-size:.85rem;color:var(--muted)}
.radio:has(input:checked){border-color:var(--saffron)}
.co{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(24px,4vw,48px);padding-bottom:clamp(40px,6vw,72px)}
.sumbox{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--surface);display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:90px}
.sumbox h3{font-size:1.3rem}
.sl{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.sl span:first-child{min-width:0}
.sl em{font-style:normal;color:var(--muted)}
.okbox{max-width:640px;margin-inline:auto;text-align:center;padding-block:clamp(40px,7vw,80px);display:flex;flex-direction:column;align-items:center;gap:14px}
.okc{width:64px;height:64px;border-radius:50%;background:var(--saffron);color:var(--on-saffron);display:grid;place-items:center}
.okc svg{width:30px;height:30px}
.ono{font-family:var(--font-display);font-size:1.5rem;letter-spacing:.06em;direction:ltr}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;margin-top:12px;font-size:.78rem;color:var(--muted)}
.stepper div{border-top:3px solid var(--line);padding-top:8px}
.stepper .on{border-top-color:var(--saffron);color:var(--fg)}
details{border-top:1px solid var(--line);padding-block:14px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--accent)}
details[open] summary::after{content:"−"}
details p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.cgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,64px);padding-bottom:clamp(40px,6vw,72px)}
.note{font-size:.85rem;color:var(--accent);min-height:1.4em}

/* story + brand */
.steps{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.steps li{border-top:2px solid var(--line);padding-top:14px;position:relative}
.steps li::before{content:"";position:absolute;top:-2px;inset-inline-start:0;width:36px;height:2px;background:var(--saffron)}
.steps .n{font-family:var(--font-display);font-size:.95rem;color:var(--accent);font-variant-numeric:tabular-nums}
.steps h3{font-size:1.15rem;font-weight:600;margin:2px 0 4px}
.steps p{margin:0;font-size:.88rem;color:var(--muted);line-height:1.6}
.lede{font-family:var(--font-display);font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1.45;max-width:30ch;font-weight:500}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-top:28px}
.tile{grid-column:span 2;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0;display:flex;flex-direction:column;gap:12px}
.tile.s3{grid-column:span 3}
.tile.s6{grid-column:span 6}
.tile .k{font-size:.74rem;letter-spacing:.08em;color:var(--muted)}
.tile.dark{background:var(--hero-bg);border-color:var(--hero-bg);color:var(--hero-fg)}
.tile.dark .k,.tile.dark p{color:var(--hero-muted)}
.tile p{margin:0;color:var(--muted)}
.mark{display:flex;align-items:center;gap:16px}
.mark svg{width:72px;height:72px;flex:none;color:var(--hero-fg)}
.mark b{font-family:var(--font-display);font-size:3.2rem;line-height:1;font-weight:700;color:var(--saffron)}
.mark small{display:block;direction:ltr;text-align:start;letter-spacing:.5em;font-size:.7rem;color:var(--hero-muted);margin-top:6px}
.sws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1}
.sw{display:flex;flex-direction:column;justify-content:flex-end;min-height:116px;padding:12px;border-radius:8px;font-size:.78rem;line-height:1.4}
.sw b{font-size:.9rem}
.sw span{direction:ltr;text-align:start;opacity:.8}
.fsample{font-family:var(--font-display);font-size:2.2rem;font-weight:600;line-height:1.1}
.bsample{font-size:1.05rem;font-weight:500}
.words{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--font-display);font-size:1.7rem;font-weight:600;line-height:1.3}
.words i{font-style:normal;color:var(--accent)}
.slogan{font-family:var(--font-display);font-size:1.6rem;font-weight:600;line-height:1.35}
.logos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.logos div{border-radius:8px;padding:18px;display:grid;place-items:center;border:1px solid var(--line)}
.logos svg{width:56px;height:56px}
.ints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.ints div{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface)}
.ints h3{font-size:1.1rem;font-weight:600;margin-bottom:2px}
.ints p{margin:0;font-size:.86rem;color:var(--muted)}

/* footer */
.foot{background:var(--hero-bg);color:var(--hero-muted);font-size:.9rem}
.foot .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:32px;padding-block:44px 28px}
.foot h4{margin:0 0 10px;color:var(--hero-fg);font-family:var(--font-display);font-size:1.1rem;font-weight:600}
.foot a{display:block;text-decoration:none;padding-block:3px}
.foot a:hover{color:var(--hero-fg)}
.foot .logo b{color:var(--saffron)}
.foot p{margin:10px 0 0;max-width:36ch}
.legal{border-top:1px solid var(--hero-line);font-size:.8rem}
.legal .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding-block:14px;grid-template-columns:none}

/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,10,5,.58);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(430px,100%);background:var(--surface);color:var(--fg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);transform:translateX(-104%);transition:transform .34s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.4rem}
.ship{padding:12px 20px;border-bottom:1px solid var(--line);font-size:.85rem}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--saffron);transition:width .4s}
.dlist{list-style:none;margin:0;padding:6px 20px;overflow-y:auto;flex:1}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;padding-block:16px;border-bottom:1px solid var(--line);align-items:start}
.thumb{width:56px;height:70px;border-radius:6px;background:linear-gradient(165deg,var(--c1),var(--c2))}
.thumb.box{background:conic-gradient(from 90deg,var(--c1),var(--c2),var(--c3),var(--c1))}
.rt b{display:block;font-family:var(--font-display);font-size:1.1rem;font-weight:600;line-height:1.3}
.rt small{color:var(--muted);font-size:.78rem;display:block;line-height:1.4}
.rt .qty{margin-top:8px}
.rt .qty button{width:32px;height:32px}
.rp{display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.rp button{border:0;background:transparent;color:var(--muted);cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.rp button:hover{color:var(--fg);background:var(--bg)}
.dempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;color:var(--muted)}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.promo{display:flex;gap:8px}
.promo .field{padding:9px 12px}
.pmsg{font-size:.8rem;min-height:1.2em;color:var(--muted)}
.pmsg.ok{color:var(--accent)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- v3: smoothness, product page, reviews ---- */
html{scroll-behavior:smooth}
#view{transition:opacity .16s ease,transform .16s ease}
#view.out{opacity:0;transform:translateY(-6px)}
.card .art-wrap{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card:hover .art-wrap{transform:translateY(-4px);box-shadow:0 18px 30px -18px rgba(90,40,10,.5)}
.btn:active,.buy:active,.chip:active,.opt:active,.ib:active{transform:scale(.97)}
.ib,.chip,.opt,.fo,.pk,.tab,.dbar,.rl,.buy,.btn{transition:border-color .2s,background .2s,color .2s,transform .2s,box-shadow .2s,opacity .2s}
.stage svg{transition:transform .15s,scale .5s cubic-bezier(.2,.8,.2,1);scale:var(--sz,1)}
.fly{position:fixed;z-index:70;width:36px;height:36px;border-radius:50%;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.cr{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.stars{position:relative;display:inline-block;color:color-mix(in srgb,var(--muted) 35%,var(--bg));letter-spacing:2px;line-height:1;white-space:nowrap}
.stars .st-f{position:absolute;top:0;inset-inline-start:0;overflow:hidden;white-space:nowrap;color:var(--saffron)}
.pnav{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.pn{display:flex;align-items:center;gap:14px;font-size:.9rem}
.pn a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);padding:8px 14px;border:1px solid var(--line);border-radius:999px;transition:all .2s}
.pn a:hover{color:var(--fg);border-color:var(--fg)}
.pcount{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.rate-line{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-size:.9rem;align-self:flex-start}
.rate-line:hover{color:var(--fg)}
.psec{padding-block:clamp(32px,5vw,56px);border-top:1px solid var(--line)}
.psec>h2,.psec .sh{font-size:clamp(1.5rem,3vw,2rem);margin-bottom:18px}
.pstory{max-width:60ch;font-size:1.12rem;line-height:1.95;margin:0 0 24px}
.facts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.facts4 div{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);transition:transform .25s,border-color .25s}
.facts4 div:hover{transform:translateY(-3px);border-color:var(--saffron)}
.facts4 small{display:block;color:var(--muted);font-size:.78rem}
.facts4 b{font-weight:600;font-size:.98rem}
.p2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:start}
.pyr{gap:8px}
.py{all:unset;box-sizing:border-box;display:block;width:var(--w);margin-inline:auto;padding:10px 14px;border-radius:8px;text-align:center;background:color-mix(in srgb,var(--c1) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c1) 35%,var(--line));font-size:.92rem;line-height:1.5;cursor:pointer;transition:transform .25s,background .25s}
.py:hover{transform:scale(1.02)}
.py.open{background:color-mix(in srgb,var(--c1) 38%,var(--surface))}
.py:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.py b{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--accent);font-weight:600}
.pyx{display:block;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s ease,opacity .3s,margin .3s;font-size:.82rem;color:var(--muted)}
.py.open .pyx{max-height:90px;opacity:1;margin-top:6px}
.mts{display:grid;gap:16px;margin-top:26px}
.mt{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:.8rem;color:var(--muted)}
.mt span:last-child{text-align:end}
.mtr{position:relative;height:6px;border-radius:3px;background:var(--line)}
.mtr b{position:absolute;inset-block:0;inset-inline-start:0;width:var(--v,50%);border-radius:3px;background:color-mix(in srgb,var(--c1) 70%,var(--saffron));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.mtr i{position:absolute;top:50%;inset-inline-start:var(--v,50%);width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--saffron);transform:translate(50%,-50%);transition:inset-inline-start 1s cubic-bezier(.2,.8,.2,1)}
.suits{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:10px}
.suits li{display:flex;gap:10px;align-items:flex-start}
.suits svg{color:var(--accent);margin-top:3px}
.pair{display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);max-width:640px;transition:border-color .25s,transform .25s}
.pair:hover{border-color:var(--saffron);transform:translateY(-2px)}
.pair .pa{aspect-ratio:4/5;border-radius:10px;display:grid;place-items:center;background:linear-gradient(165deg,color-mix(in srgb,var(--c1) 40%,var(--surface)),color-mix(in srgb,var(--c2) 24%,var(--surface)))}
.pair .pa svg{width:80%;height:auto}
.pair h3{font-size:1.3rem}
.pair p{margin:4px 0 12px;color:var(--muted);font-size:.9rem}
.rvtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,56px);align-items:start}
.rvsum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.avg{display:flex;flex-direction:column;align-items:center;gap:4px}
.avg .big{font-family:var(--font-display);font-size:3.6rem;font-weight:700;line-height:1;color:var(--accent)}
.dist{display:grid;gap:6px}
.dbar{display:grid;grid-template-columns:34px minmax(0,1fr) 22px;gap:8px;align-items:center;background:none;border:0;padding:3px 6px;border-radius:6px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.dbar:hover{background:var(--surface)}
.dbar.on{background:color-mix(in srgb,var(--saffron) 16%,transparent);color:var(--fg)}
.dbar i{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.dbar i b{display:block;height:100%;background:var(--saffron)}
.dbar em{font-style:normal;text-align:end;font-variant-numeric:tabular-nums}
.rvform{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--surface);display:grid;gap:14px}
.rvform h3{font-size:1.25rem}
.pstars{display:flex;gap:2px}
.pstars button{background:none;border:0;padding:0 2px;font-size:2rem;line-height:1;cursor:pointer;color:color-mix(in srgb,var(--muted) 35%,var(--bg));transition:transform .15s,color .15s}
.pstars button:hover{transform:scale(1.18)}
.pstars button.on{color:var(--saffron)}
.rvbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:34px 0 4px}
.rvbar select{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.rvnote{font-size:.8rem;color:var(--muted);margin:6px 0 0;max-width:62ch}
.rvi{padding-block:20px;border-top:1px solid var(--line)}
.rvh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.rvh b{font-weight:600}
.rvh .d{font-size:.8rem;color:var(--muted)}
.rvtag{font-size:.7rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.rvtag.me{border-color:var(--saffron);color:var(--accent)}
.rvi p{margin:8px 0 10px;max-width:64ch}
.rvf{display:flex;gap:14px;align-items:center;font-size:.82rem}
.hp{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;color:var(--muted);transition:all .2s}
.hp:hover{border-color:var(--fg);color:var(--fg)}
.hp[aria-pressed="true"]{background:var(--saffron);border-color:var(--saffron);color:var(--on-saffron)}
.rail{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:thin}
.rl{flex:none;width:128px;text-decoration:none;display:flex;flex-direction:column;gap:6px;scroll-snap-align:center}

function lbl(name,x,y,w,b){
  var parts=[name];
  if(name.length>9&&name.indexOf(' ')>-1){
    var ws=name.split(' '),best=1,bd=1e9;
    for(var i=1;i<ws.length;i++){var a=ws.slice(0,i).join(' '),c=ws.slice(i).join(' '),d=Math.abs(a.length-c.length);if(d<bd){bd=d;best=i}}
    parts=[ws.slice(0,best).join(' '),ws.slice(best).join(' ')];
  }
  var longest=Math.max.apply(null,parts.map(function(t){return t.length}));
  var fs=Math.min(b,w/(longest*0.55));
  return parts.map(function(t,i){
    return '<text x="'+x+'" y="'+(y+(i-(parts.length-1)/2)*fs*1.15).toFixed(1)+'" text-anchor="middle" font-family="Reem Kufi, sans-serif" font-size="'+fs.toFixed(1)+'" fill="#F3E6C8">'+t+'</text>';
  }).join('');
}

  var disc=promo?Math.round(sub*PROMO[promo]*1000)/1000:0,after=sub-disc;

function calendar(){
  var h='<div class="calg"><div class="h"></div>';
  for(var m=1;m<=12;m++)h+='<div class="h'+(m===NOW?' now':'')+'">'+MON[m-1]+'</div>';
  P.slice().sort(function(a,b){return (a.all?1:0)-(b.all?1:0)||a.seasons[0]-b.seasons[0]}).forEach(function(p){
    h+='<div class="nmc"><a href="#p-'+p.id+'">'+p.name+'</a></div>';
    for(var m=1;m<=12;m++){
      var on=p.seasons.indexOf(m)>-1,s=on&&p.seasons.indexOf(m-1)===-1,e=on&&p.seasons.indexOf(m+1)===-1;
      h+='<div class="c'+(m===NOW?' now':'')+(s?' s':'')+(e?' e':'')+'" style="--c1:'+p.c1+'">'+(on?'<i></i>':'')+'</div>';
    }
  });
  return '<div class="cal" role="img" aria-label="تقويم مواسم الروائح على اثني عشر شهرًا">'+h+'</div></div>';
}
function seasonBar(p){
  var h='<div class="seasonbar" style="--c1:'+p.c1+'">';
  for(var m=1;m<=12;m++)h+='<div class="'+(p.seasons.indexOf(m)>-1?'on':'')+(m===NOW?' nowm':'')+'"><i></i>'+MON[m-1].slice(0,3)+'</div>';
  return h+'</div>';
}

function shopVisible(){
  var toks=norm(shop.q).split(/\s+/).filter(Boolean);
  var list=P.filter(function(p){
    if(shop.cat!=='all'&&p.cat!==shop.cat)return false;
    if(p.price>shop.max)return false;
    if(shop.season&&!inSeason(p))return false;
    return toks.every(function(t){return p.hay.indexOf(t)>-1});
  });
  if(shop.sort==='asc')list.sort(function(a,b){return a.price-b.price});
  else if(shop.sort==='desc')list.sort(function(a,b){return b.price-a.price});
  else if(shop.sort==='name')list.sort(function(a,b){return a.name.localeCompare(b.name,'ar')});

/* ---------- rain canvas ---------- */
var stopRain=null;
function startRain(cv){
  var ctx=cv.getContext('2d'),W=0,H=0,rip=[],last=0,raf=0,lastPtr=0,dead=false;
  function size(){var r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.max(1,W*d);cv.height=Math.max(1,H*d);ctx.setTransform(d,0,0,d,0,0)}
  function add(x,y,prog){var max=60+Math.random()*90;rip.push({x:x,y:y,r:(prog||0)*max,max:max})}
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<rip.length;i++){var p=rip[i],a=.45*(1-p.r/p.max);if(a<=0)continue;
      ctx.strokeStyle='rgba(247,235,218,'+a.toFixed(3)+')';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.32,0,0,Math.PI*2);ctx.stroke()}
  }
  function tick(t){
    if(dead)return;
    if(t-last>360){add(Math.random()*W,H*(.3+Math.random()*.68));last=t}
    for(var i=0;i<rip.length;i++)rip[i].r+=.8;
    rip=rip.filter(function(p){return p.r<p.max});
    draw();raf=requestAnimationFrame(tick);
  }
  size();
  for(var i=0;i<9;i++)add(Math.random()*W,H*(.3+Math.random()*.68),Math.random()*.9);
  draw();
  function onResize(){size();draw()}
  window.addEventListener('resize',onResize);
  function onMove(e){var now=performance.now();if(now-lastPtr<110)return;lastPtr=now;var r=cv.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top)}
  var host=cv.parentNode;
  if(!reduce){host.addEventListener('pointermove',onMove);raf=requestAnimationFrame(tick)}
  return function(){dead=true;cancelAnimationFrame(raf);window.removeEventListener('resize',onResize);host.removeEventListener('pointermove',onMove)};
}

if(savedTheme==='light'||savedTheme==='dark')document.documentElement.setAttribute('data-theme',savedTheme);
$('#theme').addEventListener('click',function(){var n=effectiveDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);store.set('wasmi2.theme',n);syncTheme()});

/* init */
fillIcons(document);
buildChrome();
syncTheme();
$('#drawer').inert=true;
updateBadges(false,false);
renderDrawer();
window.addEventListener('hashchange',route);
route();
})();
</script>
